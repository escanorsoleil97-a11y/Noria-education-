[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install --no-audit --no-fund"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Headers de sécurité — version compatible Firebase Auth
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    X-Permitted-Cross-Domain-Policies = "none"
    X-Download-Options = "noopen"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-site"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://accounts.google.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com https://*.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.google-analytics.com https://www.google.com/recaptcha/ https://api.cloudinary.com https://cdn.jsdelivr.net; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://www.google.com/recaptcha/; worker-src 'self' blob: https://cdnjs.cloudflare.com;"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Ne jamais servir les règles ou fichiers de configuration internes.
[[redirects]]
  from = "/firestore.rules"
  to = "/__not_found__"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/functions/*"
  to = "/__not_found__"
  status = 404
  force = true

# Firebase Auth same-origin proxy for signInWithRedirect on browsers that block third-party storage.
# IMPORTANT: these are rewrites (status 200), not 302 redirects.
[[redirects]]
  from = "/__/auth/*"
  to = "https://statanalyse-pro.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://statanalyse-pro.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true
