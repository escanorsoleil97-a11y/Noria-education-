
name: fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Noria Statistique
        run: |
          set -eux

          ZIP="NoriaStat.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERREUR : NoriaStat.zip absent de la racine du dépôt"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/x
          unzip -q "$ZIP" -d /tmp/x

          test -f /tmp/x/Noria_Education/index.html

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +

          cp -r /tmp/x/Noria_Education/. .

          git config user.name "bot"
          git config user.email "bot@example.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Noria Statistique refonte"
            git push
          fi
