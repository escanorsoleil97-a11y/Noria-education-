name: Déployer Noria Statistique

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Nom du ZIP à la racine du dépôt (vide = le plus récent Noria_Statistique*.zip)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy-noria
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Préparer et déployer Noria
        shell: bash
        env:
          ZIP_INPUT: ${{ github.event.inputs.zip_name }}
        run: |
          set -Eeuo pipefail

          # 1) ZIP
          ZIP="${ZIP_INPUT:-}"
          if [ -z "$ZIP" ]; then
            ZIP="$(ls -t Noria_Statistique*.zip 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Aucun ZIP Noria_Statistique*.zip trouvé à la racine."
            find . -maxdepth 2 -type f -not -path "./.git/*" -print
            exit 1
          fi
          echo "ZIP : $ZIP"

          # 2) Extraction hors dépôt
          WORK="$(mktemp -d)"
          unzip -o -q "$ZIP" -d "$WORK"

          SOURCE=""
          for d in "$WORK" "$WORK"/*/ "$WORK"/*/*/; do
            d="${d%/}"
            if [ -f "$d/index.html" ] && [ -f "$d/netlify.toml" ]; then SOURCE="$d"; break; fi
          done
          if [ -z "$SOURCE" ]; then
            echo "::error::index.html + netlify.toml introuvables dans le ZIP."
            find "$WORK" -maxdepth 3 -print
            exit 1
          fi
          echo "Source : $SOURCE"

          # 3) Contrôles avant de toucher au dépôt
          if ! grep -q 'var DATA=\[\];var COLS=\[\];' "$SOURCE/index.html" \
             || grep -q 'let DATA=\[\];let COLS=\[\];' "$SOURCE/index.html"; then
            echo "::error::Correction d'import absente : DATA/COLS doivent être déclarés avec var (v3 ou plus récent)."
            exit 1
          fi
          if [ ! -f "$SOURCE/netlify/functions/admin.js" ]; then
            echo "::error::netlify/functions/admin.js manquant."
            exit 1
          fi

          node -e '
            const fs=require("fs");
            const s=fs.readFileSync(process.argv[1],"utf8");
            const re=/<script([^>]*)>([\s\S]*?)<\/script>/g;
            let m,bad=0,n=0;
            while((m=re.exec(s))){
              if(/src=|type="module"/.test(m[1]))continue;
              n++;
              try{new Function(m[2])}catch(e){bad++;console.log("Erreur de syntaxe :",e.message)}
            }
            console.log(n+" scripts vérifiés, "+bad+" erreur(s)");
            process.exit(bad?1:0);
          ' "$SOURCE/index.html"

          # 4) Remplacement du contenu (le ZIP n'est pas republié)
          git config user.name "Noria Bot"
          git config user.email "noria-bot@users.noreply.github.com"
          git pull --rebase origin main

          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          cp -a "$SOURCE/." .

          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git commit -m "Déployer Noria Statistique ($ZIP)"

          # 5) Push avec 3 tentatives
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Poussé sur main. Netlify publie automatiquement."
              exit 0
            fi
            echo "Push refusé (tentative $i/3), nouvelle synchronisation..."
            git pull --rebase origin main
          done
          echo "::error::Échec du push après 3 tentatives."
          exit 1
