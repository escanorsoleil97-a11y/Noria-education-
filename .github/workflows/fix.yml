name: fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Noria Statistique
        run: |
          set -e

          mkdir -p /tmp/x

          test -f Noria_Statistique_refonte.zip

          cp Noria_Statistique_refonte.zip /tmp/x/

          cd /tmp/x
          unzip -q Noria_Statistique_refonte.zip

          test -d Noria_Education

          cd "$GITHUB_WORKSPACE"

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +

          cp -r /tmp/x/Noria_Education/. .

          git config user.name "bot"
          git config user.email "bot@example.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Noria Statistique refonte"
            git push
          fi
