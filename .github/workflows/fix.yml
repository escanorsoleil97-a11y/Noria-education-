name: Déployer Noria Statistique

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Nom du ZIP à la racine du dépôt (laisser vide = détection automatique)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy-noria
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer et déployer Noria
        shell: bash
        env:
          ZIP_INPUT: ${{ github.event.inputs.zip_name }}
        run: |
          set -Eeuo pipefail

          echo "Recherche du fichier ZIP..."

          ZIP=""
          if [ -n "${ZIP_INPUT:-}" ]; then
            ZIP="$ZIP_INPUT"
          else
            # Le ZIP le plus récent à la racine dont le nom commence par Noria_Statistique
            ZIP="$(ls -t Noria_Statistique*.zip 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "Erreur : aucun ZIP Noria_Statistique*.zip trouvé à la racine du dépôt."
            echo "Fichiers présents :"
            find . -maxdepth 3 -type f -not -path "./.git/*" -print
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          rm -rf /tmp/noria
          mkdir -p /tmp/noria
          unzip -o -q "$ZIP" -d /tmp/noria

          SOURCE="/tmp/noria/Noria_Education"

          if [ ! -d "$SOURCE" ]; then
            echo "Erreur : le dossier Noria_Education est introuvable dans le ZIP."
            echo "Structure extraite :"
            find /tmp/noria -maxdepth 3 -print
            exit 1
          fi

          if [ ! -f "$SOURCE/index.html" ]; then
            echo "Erreur : index.html est introuvable dans $SOURCE."
            find "$SOURCE" -maxdepth 3 -type f -print
            exit 1
          fi

          # Contrôle de la correction de l'import (DATA/COLS doivent être des var globales)
          if ! grep -q "<script>var DATA=\[\];var COLS=\[\];" "$SOURCE/index.html"; then
            echo "Erreur : index.html ne contient pas la correction var DATA / var COLS."
            echo "Ce ZIP n'est pas la version corrigée (v3 ou plus récente)."
            exit 1
          fi

          # Contrôle de la présence des fonctions Netlify
          if [ ! -f "$SOURCE/netlify/functions/admin.js" ] || [ ! -f "$SOURCE/netlify.toml" ]; then
            echo "Erreur : netlify.toml ou netlify/functions/admin.js manquant dans le ZIP."
            exit 1
          fi

          echo "Nettoyage de l'ancienne version (le ZIP est supprimé du dépôt pour ne pas être publié)..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Copie de la nouvelle version..."
          cp -a "$SOURCE/." .

          echo "Fichiers déployés :"
          ls -la

          git config user.name "Noria Bot"
          git config user.email "noria-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Déployer Noria Statistique ($ZIP)"

          git pull --rebase origin main || true
          git push origin HEAD:main

          echo "Déploiement poussé sur main. Netlify va publier automatiquement."
