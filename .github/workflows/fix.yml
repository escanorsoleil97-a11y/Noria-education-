name: Déployer Noria Statistique

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer et déployer Noria
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="Noria_Statistique_FINAL.zip"

          echo "Recherche du fichier ZIP..."

          if [ ! -f "$ZIP" ]; then
            echo "Erreur : $ZIP est introuvable à la racine du dépôt."
            echo "Fichiers présents :"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          rm -rf /tmp/noria
          mkdir -p /tmp/noria

          unzip -o -q "$ZIP" -d /tmp/noria

          SOURCE="/tmp/noria/Noria_Education"

          if [ ! -d "$SOURCE" ]; then
            echo "Erreur : le dossier Noria_Education est introuvable dans le ZIP."
            echo "Structure extraite :"
            find /tmp/noria -maxdepth 3 -print
            exit 1
          fi

          if [ ! -f "$SOURCE/index.html" ]; then
            echo "Erreur : index.html est introuvable dans $SOURCE."
            find "$SOURCE" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Nettoyage de l'ancienne version..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Copie de la nouvelle version..."

          cp -a "$SOURCE/." .

          echo "Fichiers déployés :"
          ls -la

          git config user.name "Noria Bot"
          git config user.email "noria-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Déployer Noria Statistique"
          git push origin HEAD:main
