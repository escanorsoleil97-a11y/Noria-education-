name: fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Noria Statistique
        run: |
          set -e
          ZIP="Noria_Statistique_FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP introuvable"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/noria
          unzip -q "$ZIP" -d /tmp/noria

          SOURCE="/tmp/noria/Noria_Education"

          if [ ! -f "$SOURCE/index.html" ]; then
            echo "index.html introuvable dans le ZIP"
            find /tmp/noria -maxdepth 3 -type f
            exit 1
          fi

          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +

          cp -a "$SOURCE/." .

          git config user.name "Noria Bot"
          git config user.email "noria-bot@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Deploy Noria Statistique"
            git push origin HEAD:main
          fi
