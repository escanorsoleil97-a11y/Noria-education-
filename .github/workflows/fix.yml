name: fix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir /tmp/x
          cp Noria_Education_cloudflare.zip /tmp/x/
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cd /tmp/x && unzip -q Noria_Education_cloudflare.zip
          cd $GITHUB_WORKSPACE
          cp -r /tmp/x/Noria_Education/. .
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "Noria structure"
          git push
